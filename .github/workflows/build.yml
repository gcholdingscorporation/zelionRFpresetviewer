name: build

# Produces the two distributables. The Android APK has to be built here rather
# than locally, because it needs the Android SDK.
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'README.md'
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: parser and metadata self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/selftest.js

  render:
    name: values traced back to the file
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_single.py
      - run: npm install --no-save playwright@1.49.1
      - run: npx playwright install --with-deps chromium
      # Loads the built page for each sample and re-derives every value it
      # shows straight from the file, independently of the viewer's own code.
      - run: node tools/verify_render.js samples/*.txt

  windows-exe:
    name: portable Windows .exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Zig is only used as a C cross-compiler; there is no Zig code here.
      - run: pip install ziglang
      - run: python3 tools/build_windows.py
      - name: Confirm it depends on nothing but Windows itself
        run: |
          python3 - <<'PY'
          import re
          data = open('dist/RotorflightPresetViewer.exe', 'rb').read()
          dlls = sorted({m.group(0).decode().lower()
                         for m in re.finditer(rb'[A-Za-z0-9_\-]+\.dll', data, re.I)})
          print('imports:', ', '.join(dlls))
          allowed = {'kernel32.dll', 'shell32.dll', 'user32.dll', 'advapi32.dll'}
          extra = set(dlls) - allowed
          assert not extra, 'unexpected dependency: %s' % ', '.join(sorted(extra))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RotorflightPresetViewer-windows
          path: |
            dist/RotorflightPresetViewer.exe
            dist/rotorflight-preset-viewer.html
          if-no-files-found: error

  android-apk:
    name: Android .apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # No setup-android step: the runner image already ships the SDK with its
      # licences accepted, and the action asks sdkmanager for the long-removed
      # "tools" package, which fails.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Show the SDK the runner provides
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The APK bundles the same single-file page the .exe does.
      - run: python3 tools/build_single.py
      - name: Assemble
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Rename to something recognisable
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/RotorflightPresetViewer.apk
          ls -la out

      # Assert the properties the README claims, so they cannot quietly stop
      # being true.
      - name: Check the APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          echo "using $BUILD_TOOLS"

          echo '--- badging ---'
          "$BUILD_TOOLS/aapt2" dump badging out/RotorflightPresetViewer.apk | tee badging.txt

          echo '--- it must request no permissions ---'
          if grep -q "uses-permission" badging.txt; then
            echo 'FAIL: the APK requests permissions'
            exit 1
          fi

          echo '--- the viewer must be bundled ---'
          SIZE="$(unzip -p out/RotorflightPresetViewer.apk assets/viewer.html | wc -c)"
          echo "assets/viewer.html is $SIZE bytes"
          test "$SIZE" -gt 200000
          unzip -p out/RotorflightPresetViewer.apk assets/viewer.html \
            | grep -q 'Rotorflight Preset Viewer'

          echo '--- signature ---'
          "$BUILD_TOOLS/apksigner" verify --print-certs out/RotorflightPresetViewer.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RotorflightPresetViewer-android
          path: out/RotorflightPresetViewer.apk
          if-no-files-found: error

  publish-apk:
    name: commit the APK next to the .exe
    needs: android-apk
    runs-on: ubuntu-latest
    # The Android SDK is not available everywhere this project is developed, so
    # the built APK is committed to dist/ to sit alongside the .exe. A push that
    # only touches dist/ is ignored by the trigger above, so this cannot loop.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: RotorflightPresetViewer-android
          path: dist
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/RotorflightPresetViewer.apk
          if git diff --cached --quiet; then
            echo 'APK unchanged'
            exit 0
          fi
          git commit -m 'CI: publish the Android APK [skip ci]'
          git push origin HEAD:"${GITHUB_REF_NAME}"
