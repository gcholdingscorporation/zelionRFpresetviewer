name: release

# Publishes a GitHub Release carrying every platform package.
#
#   git tag v2.0.0 && git push origin v2.0.0
#
# or run this workflow by hand and give it a tag name. Everything is rebuilt
# from the tagged source rather than taken from dist/, so a release can never
# ship a stale binary somebody forgot to regenerate.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (created at the current commit if new)'
        required: true
      prerelease:
        description: 'Mark as a pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    name: build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Nothing ships if the parser or the generated metadata is broken.
      - name: Self-test
        run: node tools/selftest.js

      # build_windows.py runs build_single.py first, so this produces both the
      # standalone page and the executable that embeds it.
      - name: Build the page and the Windows executable
        run: |
          pip install ziglang
          python3 tools/build_windows.py

      # A release is exactly when it matters that the pages render what the
      # file says and that the comparison agrees with the files it compares,
      # so both browser checks run here too, against the page about to ship.
      - name: Verify what the page renders
        run: |
          npm install --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/verify_render.js samples/*.txt
          node tools/verify_compare.js samples/*.txt

      - name: Build the Android package
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Collect the packages
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/RotorflightPresetViewer.exe release/
          cp dist/rotorflight-preset-viewer.html release/
          cp android/app/build/outputs/apk/release/*.apk release/RotorflightPresetViewer.apk
          ls -la release

      # Re-check the claims the release notes make, against the exact files
      # about to be published.
      - name: Verify the packages
        run: |
          set -euo pipefail

          echo '--- the .exe must import nothing but Windows itself ---'
          python3 - <<'PY'
          import re
          data = open('release/RotorflightPresetViewer.exe', 'rb').read()
          dlls = sorted({m.group(0).decode().lower()
                         for m in re.finditer(rb'[A-Za-z0-9_\-]+\.dll', data, re.I)})
          print('imports:', ', '.join(dlls))
          extra = set(dlls) - {'kernel32.dll', 'shell32.dll', 'user32.dll', 'advapi32.dll'}
          assert not extra, 'unexpected dependency: %s' % ', '.join(sorted(extra))
          PY

          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"

          echo '--- the .apk must request no permissions ---'
          "$BUILD_TOOLS/aapt2" dump badging release/RotorflightPresetViewer.apk > badging.txt
          if grep -q 'uses-permission' badging.txt; then
            echo 'FAIL: the APK requests permissions'
            exit 1
          fi
          "$BUILD_TOOLS/apksigner" verify --print-certs release/RotorflightPresetViewer.apk

          echo '--- all three must carry the same viewer ---'
          unzip -p release/RotorflightPresetViewer.apk assets/viewer.html > apk-page.html
          cmp apk-page.html release/rotorflight-preset-viewer.html
          echo 'the APK bundles the published page byte for byte'
          # The .exe embeds the page verbatim, so the page must appear inside it.
          python3 - <<'PY'
          page = open('release/rotorflight-preset-viewer.html', 'rb').read()
          exe = open('release/RotorflightPresetViewer.exe', 'rb').read()
          assert page in exe, 'the .exe does not embed the published page'
          print('the .exe embeds the published page byte for byte')
          PY
          rm -f apk-page.html badging.txt

      - name: Checksums
        run: |
          cd release
          sha256sum RotorflightPresetViewer.exe \
                    RotorflightPresetViewer.apk \
                    rotorflight-preset-viewer.html > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write the release notes
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # paste -d takes single characters, so it cannot join with " and ".
          FW="$(python3 - <<'VERSIONS'
          import glob, re
          found = sorted(re.search(r'rf-(.+)\.js$', p).group(1)
                         for p in glob.glob('data/rf-*.js'))
          print(' and '.join(found) if len(found) < 3
                else ', '.join(found[:-1]) + ' and ' + found[-1])
          VERSIONS
          )"

          cat > notes.md <<NOTES
          A read-only viewer for Rotorflight CLI files. Load a \`dump all\`, a
          \`diff all\` or a preset and it is laid out the way the Rotorflight
          Configurator lays out its tabs, with every value shown next to the
          factory default for the firmware that produced the file. Load a second
          file and the two are shown side by side with everything they disagree
          on marked.

          It never talks to a flight controller and cannot change one.

          ## Which file do I want?

          | You have | Download | Notes |
          | --- | --- | --- |
          | **Windows** | \`RotorflightPresetViewer.exe\` | Double-click; opens in its own window. Drag a dump onto it to open straight into that file. |
          | **Android 8+** | \`RotorflightPresetViewer.apk\` | Sideload it. Requests no permissions at all. |
          | **iPhone, iPad, Mac, Linux, anything else** | \`rotorflight-preset-viewer.html\` | One file, open it in any browser. Works offline. |

          All three carry the same viewer — the build verifies that the page
          inside the .exe and the .apk is byte for byte the published \`.html\`.

          ## No dependencies

          - The \`.exe\` imports only \`kernel32\`, \`shell32\`, \`user32\` and
            \`advapi32\`, all parts of Windows. No runtime, no framework, no
            bundled browser engine, and deliberately no dependency on the
            Universal C Runtime. Its window is Edge's application mode, so
            nothing extra is installed; without Edge or Chrome it falls back to
            the default browser.
          - The \`.apk\` declares no permissions. The viewer is inside the APK,
            so the app never reaches the network.
          - The \`.html\` has everything inlined and fetches nothing.

          ## Firmware coverage

          Setting names, scopes, ranges, enum values and factory defaults are
          generated from the Rotorflight firmware source, for **$FW**. The
          version banner in your file picks the matching set. Names from a newer
          firmware are flagged rather than dropped.

          Values are shown the way the Configurator shows them. Rotorflight
          stores a number of settings in scaled integer units — the CLI prints
          \`gov_spoolup_time = 300\` where the Configurator shows \`30.0 s\` — and
          the same factors are applied here. They are not guessed: they are
          extracted from the Configurator's own bindings, per firmware release,
          because several changed between releases. A setting with no such
          binding is shown exactly as the CLI printed it.

          ## Comparing two files

          Open a file, then **Compare with…** — or drop two files on the page at
          once. The page draws itself once per file, side by side, and marks
          what they disagree on: blue where both pages show a row differently,
          purple where only one of them has the row at all, a count per tab in
          the rail, and a **Differences only** filter. **All Settings** becomes
          one list of every setting either file names with a column each, and
          the **CLI** tab marks the lines one file has that the other does not.

          A setting one file leaves out is compared at its firmware default, so
          a \`dump all\` and a \`diff all\` of the same aircraft agree instead of
          disagreeing over every line the \`diff\` omits.

          ## Verify your download

          \`\`\`
          sha256sum -c SHA256SUMS.txt
          \`\`\`

          ## Known limitations

          - The Android app is signed with the throwaway key in
            \`android/sideload-debug.keystore\`, so Android will ask you to allow
            an unknown source. That key secures nothing.
          - No iOS app: Apple allows neither third-party browser engines nor
            sideloading. Use the \`.html\`; "Add to Home Screen" gives it an icon.
          - No OSD preview and no rendered LED strip; those are shown as raw
            values.
          NOTES

          echo '' >> notes.md
          echo '## Checksums' >> notes.md
          echo '' >> notes.md
          echo '```' >> notes.md
          cat release/SHA256SUMS.txt >> notes.md
          echo '```' >> notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PRERELEASE=""
          if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
            PRERELEASE="--prerelease"
          fi

          # Re-running a release should replace its assets, not fail.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "updating the existing release $TAG"
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" release/* \
              --title "Rotorflight Preset Viewer $TAG" \
              --notes-file notes.md \
              --target "${{ github.sha }}" \
              $PRERELEASE
          fi

          gh release view "$TAG" --json tagName,name,assets \
            --jq '.tagName, .name, (.assets[] | "\(.name)  \(.size) bytes")'
